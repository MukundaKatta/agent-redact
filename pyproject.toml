[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-redact"
version = "0.1.0"
description = "Zero-dependency PII and secret scrubber for AI agent logs, traces, and audit output."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mukunda Katta" }]
requires-python = ">=3.10"
keywords = ["ai", "agents", "pii", "redaction", "secrets", "security", "audit", "logs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/MukundaKatta/agent-redact"
Repository = "https://github.com/MukundaKatta/agent-redact"
Issues = "https://github.com/MukundaKatta/agent-redact/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_redact"]
